<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bogzilla</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>bogzilla</h1>
      <p id="progress"></p>
    </header>
    <main>
      <div id="board-wrap" hidden>
        <div id="board"></div>
        <svg id="trace" aria-hidden="true"></svg>
      </div>
      <p id="status">Open a Wordshake Boggle game to get hints.</p>
    </main>
    <footer>
      <button id="skip" type="button" disabled>Skip</button>
      <button id="hide" type="button" aria-pressed="false" disabled>Hide hint</button>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
