<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bogzilla</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <img src="logo.svg" alt="" width="28" height="28" />
      <h1>bogzilla</h1>
      <p id="progress"></p>
    </header>

    <main>
      <div id="board-wrap" hidden>
        <svg id="pipe" aria-hidden="true"></svg>
        <div id="board"></div>
        <svg id="arrows" aria-hidden="true"></svg>
      </div>
      <p id="status">Open a Wordshake Boggle game to get hints.</p>

      <div id="controls" hidden>
        <div id="lengths" role="group" aria-label="Word length"></div>
        <button id="skip" type="button">Another word</button>
      </div>

      <section id="found-section" hidden>
        <h2>Found <span id="found-count"></span></h2>
        <div id="found"></div>
      </section>
    </main>

    <script src="sidepanel.js"></script>
  </body>
</html>
